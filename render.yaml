# One-click deploy on Render (free tier): New + > Blueprint > pick this repo.
services:
  - type: web
    name: spotter-fuel-route
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
